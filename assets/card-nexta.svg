<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 240" width="100%" height="auto">
  <defs>
    <linearGradient id="bgNexta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#0F0C29" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Animated Cyber Shine -->
    <linearGradient id="btnCyber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#6366F1" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="2.2s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <!-- Card Background with Shadow -->
  <rect x="10" y="10" width="440" height="220" rx="16" fill="#000000" />
  <rect x="6" y="6" width="440" height="220" rx="16" fill="url(#bgNexta)" stroke="#818CF8" stroke-width="3" />

  <!-- Corner Tag -->
  <g transform="translate(24, 20)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#000000" stroke="#818CF8" stroke-width="1.5" />
    <circle cx="12" cy="12" r="4" fill="#818CF8">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="24" y="16" font-family="'Impact', Arial, sans-serif" font-size="11" fill="#C7D2FE" letter-spacing="1">
      🚀 AGENCY HQ
    </text>
  </g>

  <!-- Floating Sticker (Wobbling) -->
  <g transform="translate(315, 16) rotate(4)">
    <rect x="0" y="0" width="115" height="26" rx="6" fill="#00F0FF" stroke="#000000" stroke-width="2" />
    <text x="57" y="17" text-anchor="middle" font-family="'Impact', Arial, sans-serif" font-size="10.5" font-weight="900" fill="#000000">
      👔 CEO APPROVED
    </text>
    <animateTransform attributeName="transform" type="rotate" values="4; -3; 4" dur="3s" repeatCount="indefinite" />
  </g>

  <!-- Big Project Title -->
  <g transform="translate(24, 82)">
    <text x="2" y="2" font-family="'Impact', Arial Black, sans-serif" font-size="34" fill="#000000">
      👑 Nexta Official
    </text>
    <text x="0" y="0" font-family="'Impact', Arial Black, sans-serif" font-size="34" fill="#FFFFFF">
      👑 Nexta Official
    </text>
  </g>

  <!-- Catchy Subtitle -->
  <text x="24" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#C7D2FE">
    Leading Nexta digital agency &amp; creator powerhouse.
  </text>
  <text x="24" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#A5B4FC">
    Delivering modern web experiences &amp; collaborative software.
  </text>

  <!-- Tech Badges -->
  <g transform="translate(24, 146)">
    <rect x="0" y="0" width="85" height="20" rx="4" fill="#0F0C29" stroke="#818CF8" stroke-width="1" />
    <text x="42" y="14" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#818CF8">Architecture</text>

    <rect x="91" y="0" width="55" height="20" rx="4" fill="#0F0C29" stroke="#818CF8" stroke-width="1" />
    <text x="118" y="14" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#818CF8">UI/UX</text>

    <rect x="152" y="0" width="65" height="20" rx="4" fill="#0F0C29" stroke="#818CF8" stroke-width="1" />
    <text x="184" y="14" text-anchor="middle" font-family="monospace" font-size="9.5" font-weight="700" fill="#818CF8">Branding</text>
  </g>

  <!-- ================= BIG CLICKABLE ACTION BUTTON ================= -->
  <g transform="translate(24, 180)">
    <!-- Button Shadow -->
    <rect x="4" y="4" width="408" height="38" rx="10" fill="#000000" />
    <!-- Main Button Body with Glowing Cyber Shine -->
    <rect x="0" y="0" width="408" height="38" rx="10" fill="#818CF8" stroke="#000000" stroke-width="2.5" />
    <rect x="0" y="0" width="408" height="38" rx="10" fill="url(#btnCyber)" opacity="0.6" />

    <!-- Button Text -->
    <text x="204" y="24" text-anchor="middle" font-family="'Impact', Arial Black, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" letter-spacing="1.2">
      🚀 ENTER NEXTA HQ (CLICK HERE) ↗
    </text>
  </g>
</svg>
