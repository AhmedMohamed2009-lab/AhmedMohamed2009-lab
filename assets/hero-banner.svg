<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="auto">
  <defs>
    <pattern id="gridDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#2A3042" opacity="0.65" />
    </pattern>
    <linearGradient id="shineSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="3.4s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  
  <rect x="12" y="12" width="976" height="296" rx="18" fill="#121622" stroke="#080A0F" stroke-width="5" />
  <rect x="12" y="12" width="976" height="296" rx="18" fill="url(#gridDots)" />
  <rect x="12" y="12" width="976" height="296" rx="18" fill="url(#shineSweep)" />

  
  <g transform="translate(36, 26)">
    <rect x="4" y="4" width="220" height="34" rx="8" fill="#080A0F" />
    <rect x="0" y="0" width="220" height="34" rx="8" fill="#00E5FF" stroke="#080A0F" stroke-width="3.5" />
    <text x="110" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="900" fill="#080A0F" letter-spacing="1">STUDENT • EGYPT</text>
  </g>

  
  <g transform="translate(36, 82)">
    <rect x="6" y="6" width="545" height="118" rx="14" fill="#080A0F" />
    <rect x="0" y="0" width="545" height="118" rx="14" fill="#FF4D6D" stroke="#080A0F" stroke-width="4.5" />
    <text x="24" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="800" fill="#080A0F" letter-spacing="2">HEY, I'M</text>
    <text x="24" y="72" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" stroke="#080A0F" stroke-width="1.5" letter-spacing="1">AHMED MOHAMED</text>
    <text x="24" y="103" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="900" fill="#FFF04B" stroke="#080A0F" stroke-width="0.8">@tOlbaa</text>
  </g>

  
  <g transform="translate(36, 222)">
    <rect x="4" y="4" width="245" height="38" rx="10" fill="#080A0F" />
    <rect x="0" y="0" width="245" height="38" rx="10" fill="#B892FF" stroke="#080A0F" stroke-width="3.5">
      <animate attributeName="fill" values="#B892FF;#6BFFB8;#B892FF" dur="5s" repeatCount="indefinite" />
    </rect>
    <text x="122" y="25" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15" font-weight="900" fill="#080A0F" letter-spacing="0.8">CEO OF NEXTA</text>
  </g>

  
  <g transform="translate(615, 34)">
    <g transform="rotate(-3 110 22)">
      <rect x="4" y="4" width="220" height="44" rx="10" fill="#080A0F" />
      <rect x="0" y="0" width="220" height="44" rx="10" fill="#FFF04B" stroke="#080A0F" stroke-width="3.5" />
      <text x="110" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="900" fill="#080A0F">JUNIOR SWE</text>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-4; 0,0" dur="3.2s" repeatCount="indefinite" />
    </g>

    <g transform="translate(115, 64) rotate(2.5 110 22)">
      <rect x="4" y="4" width="220" height="44" rx="10" fill="#080A0F" />
      <rect x="0" y="0" width="220" height="44" rx="10" fill="#00E5FF" stroke="#080A0F" stroke-width="3.5" />
      <text x="110" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="900" fill="#080A0F">WEB DEVELOPMENT</text>
      <animateTransform attributeName="transform" type="translate" values="115,64; 115,69; 115,64" dur="3.8s" repeatCount="indefinite" />
    </g>

    <g transform="translate(8, 128) rotate(-2 135 22)">
      <rect x="4" y="4" width="265" height="44" rx="10" fill="#080A0F" />
      <rect x="0" y="0" width="265" height="44" rx="10" fill="#6BFFB8" stroke="#080A0F" stroke-width="3.5" />
      <text x="132" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="900" fill="#080A0F">STILL LEARNING &amp; TRYING</text>
      <animateTransform attributeName="transform" type="translate" values="8,128; 8,123; 8,128" dur="4.1s" repeatCount="indefinite" />
    </g>

    <g transform="translate(155, 192) rotate(3 95 22)">
      <rect x="4" y="4" width="185" height="44" rx="10" fill="#080A0F" />
      <rect x="0" y="0" width="185" height="44" rx="10" fill="#FF9F43" stroke="#080A0F" stroke-width="3.5" />
      <text x="92" y="28" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13.5" font-weight="900" fill="#080A0F">GAMING</text>
      <animateTransform attributeName="transform" type="translate" values="155,192; 155,197; 155,192" dur="2.9s" repeatCount="indefinite" />
    </g>
  </g>
</svg>
