<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 180" width="100%" height="auto">
  <defs>
    <linearGradient id="bgLink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#083344" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Animated Cyan Wave Sweep -->
    <linearGradient id="btnCyanWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F0FF" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="2s" repeatCount="indefinite" />
    </linearGradient>
  </defs>

  <!-- Card Background with Shadow -->
  <rect x="8" y="8" width="924" height="164" rx="16" fill="#000000" />
  <rect x="4" y="4" width="924" height="164" rx="16" fill="url(#bgLink)" stroke="#00F0FF" stroke-width="2.5" />

  <!-- Left Content -->
  <g transform="translate(32, 22)">
    
    <!-- Badges Row -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="140" height="24" rx="6" fill="#000000" stroke="#00F0FF" stroke-width="1.5" />
      <circle cx="12" cy="12" r="4" fill="#00F0FF">
        <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite" />
      </circle>
      <text x="24" y="16" font-family="'Impact', Arial, sans-serif" font-size="11" fill="#00F0FF" letter-spacing="1">
        🛸 NEXTA GATEWAY
      </text>

      <g transform="translate(150, 0)">
        <rect x="0" y="0" width="135" height="24" rx="6" fill="#000000" stroke="#FFE600" stroke-width="1.5" />
        <text x="67" y="16" text-anchor="middle" font-family="'Impact', Arial, sans-serif" font-size="11" fill="#FFE600">
          ⚡ ALL-IN-ONE HUB
        </text>
      </g>
    </g>

    <!-- Big Project Title -->
    <g transform="translate(0, 58)">
      <text x="2" y="2" font-family="'Impact', Arial Black, sans-serif" font-size="32" fill="#000000">
        Nexta Link
      </text>
      <text x="0" y="0" font-family="'Impact', Arial Black, sans-serif" font-size="32" fill="#00F0FF">
        Nexta Link
      </text>
      <text x="170" y="-3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#E2E8F0">
        — The central interconnected portal linking all Nexta products, projects &amp; socials.
      </text>
    </g>

    <text x="0" y="86" font-family="ui-monospace, monospace" font-size="12" font-weight="700" fill="#38BDF8">
      mohamed-mma.github.io/Nexta-Link/ • One click to explore the whole ecosystem
    </text>
  </g>

  <!-- Right Floating Sticker -->
  <g transform="translate(805, 20) rotate(5)">
    <rect x="0" y="0" width="105" height="26" rx="6" fill="#FFE600" stroke="#000000" stroke-width="2" />
    <text x="52" y="17" text-anchor="middle" font-family="'Impact', Arial, sans-serif" font-size="11" font-weight="900" fill="#000000">
      WARP SPEED 🚀
    </text>
    <animateTransform attributeName="transform" type="rotate" values="5; -3; 5" dur="3s" repeatCount="indefinite" />
  </g>

  <!-- Bottom Action Button Across Full Width -->
  <g transform="translate(32, 118)">
    <rect x="4" y="4" width="872" height="38" rx="10" fill="#000000" />
    <rect x="0" y="0" width="872" height="38" rx="10" fill="#00F0FF" stroke="#000000" stroke-width="2.5" />
    <rect x="0" y="0" width="872" height="38" rx="10" fill="url(#btnCyanWave)" opacity="0.6" />

    <text x="436" y="24" text-anchor="middle" font-family="'Impact', Arial Black, sans-serif" font-size="16" font-weight="900" fill="#000000" letter-spacing="1.5">
      ⚡ TELEPORT VIA NEXTA LINK (CLICK HERE TO OPEN) ↗
    </text>
  </g>
</svg>
