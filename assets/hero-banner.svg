<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Accent Linear Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Shimmer Glow Animation -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
      <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="10s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dotGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.2" fill="#334155" opacity="0.45" />
    </pattern>

    <!-- Soft Radial Ambient Glows -->
    <radialGradient id="glowCyan" cx="15%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowPurple" cx="85%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect x="2" y="2" width="956" height="266" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5" />
  
  <!-- Glowing Corner Lights -->
  <rect x="2" y="2" width="956" height="266" rx="16" fill="url(#glowCyan)" />
  <rect x="2" y="2" width="956" height="266" rx="16" fill="url(#glowPurple)" />
  <rect x="2" y="2" width="956" height="266" rx="16" fill="url(#dotGrid)" />

  <!-- Top Accent Glowing Line -->
  <path d="M 18 2 L 942 2" stroke="url(#cyanPurple)" stroke-width="2.5" stroke-linecap="round" />

  <!-- ================= LEFT COLUMN: HERO CONTENT ================= -->
  <g transform="translate(42, 38)">
    
    <!-- Status Pill -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="280" height="28" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <circle cx="15" cy="14" r="4.5" fill="#10B981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="27" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.8">AVAILABLE FOR COLLABORATION</text>
    </g>

    <!-- Main Name Title -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif" font-size="38" font-weight="900" fill="url(#nameGrad)" letter-spacing="-0.5">
      Ahmed Mohamed
    </text>
    
    <!-- Handle / Alias Tag -->
    <text x="340" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" font-weight="700" fill="#38BDF8" opacity="0.9">
      @tOlbaa
    </text>

    <!-- Subtitle / Title -->
    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="700" fill="#E2E8F0">
      Software Engineer &amp; Web Developer
    </text>

    <!-- Brief Bio / Focus -->
    <text x="0" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8">
      Building modern web apps, sleek UI/UX &amp; creative digital experiences.
    </text>

    <!-- Quick Badges Row -->
    <g transform="translate(0, 150)">
      <!-- Badge 1: Nexta -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="160" height="28" rx="6" fill="#1E293B" stroke="#818CF8" stroke-width="1" />
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#C7D2FE">🚀 Co-Founder @ Nexta</text>
      </g>

      <!-- Badge 2: Location -->
      <g transform="translate(168, 0)">
        <rect x="0" y="0" width="112" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#CBD5E1">📍 Egypt 🇪🇬</text>
      </g>

      <!-- Badge 3: Focus -->
      <g transform="translate(288, 0)">
        <rect x="0" y="0" width="168" height="28" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1" />
        <text x="12" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" fill="#38BDF8">⚡ Full-Stack Mindset</text>
      </g>
    </g>

  </g>

  <!-- ================= RIGHT COLUMN: CODE / TERMINAL CARD ================= -->
  <g transform="translate(560, 32)">
    <!-- Terminal Background Card -->
    <rect x="0" y="0" width="360" height="206" rx="12" fill="#090D16" stroke="#1E293B" stroke-width="1.2" />
    
    <!-- Window Bar -->
    <rect x="0" y="0" width="360" height="34" rx="12" fill="#0F172A" />
    <path d="M 0 24 L 0 34 L 360 34 L 360 24 Z" fill="#0F172A" />
    <line x1="0" y1="34" x2="360" y2="34" stroke="#1E293B" stroke-width="1" />
    
    <!-- Window Controls -->
    <circle cx="18" cy="17" r="4.5" fill="#EF4444" />
    <circle cx="34" cy="17" r="4.5" fill="#F59E0B" />
    <circle cx="50" cy="17" r="4.5" fill="#10B981" />

    <!-- Terminal Tab Title -->
    <text x="180" y="21" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" fill="#64748B">ahmed.profile.ts</text>

    <!-- Code Content -->
    <g transform="translate(20, 56)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12">
      <!-- Line 1 -->
      <text y="0">
        <tspan fill="#F43F5E">const</tspan> <tspan fill="#38BDF8">developer</tspan> <tspan fill="#94A3B8">=</tspan> <tspan fill="#E2E8F0">{</tspan>
      </text>

      <!-- Line 2 -->
      <text y="22">
        <tspan fill="#94A3B8" dx="14">name:</tspan> <tspan fill="#A7F3D0">"Ahmed Mohamed"</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <!-- Line 3 -->
      <text y="44">
        <tspan fill="#94A3B8" dx="14">role:</tspan> <tspan fill="#A7F3D0">"Web &amp; Game Dev"</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <!-- Line 4 -->
      <text y="66">
        <tspan fill="#94A3B8" dx="14">enterprise:</tspan> <tspan fill="#A7F3D0">"Nexta"</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <!-- Line 5 -->
      <text y="88">
        <tspan fill="#94A3B8" dx="14">crafts:</tspan> <tspan fill="#E2E8F0">[</tspan><tspan fill="#FBCFE8">"Web"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#FBCFE8">"UI/UX"</tspan><tspan fill="#94A3B8">, </tspan><tspan fill="#FBCFE8">"Apps"</tspan><tspan fill="#E2E8F0">]</tspan><tspan fill="#94A3B8">,</tspan>
      </text>

      <!-- Line 6 -->
      <text y="110">
        <tspan fill="#94A3B8" dx="14">openToWork:</tspan> <tspan fill="#38BDF8">true</tspan>
      </text>

      <!-- Line 7 -->
      <text y="132">
        <tspan fill="#E2E8F0">}</tspan><tspan fill="#94A3B8">;</tspan>
      </text>
    </g>
  </g>
</svg>
