<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 90" width="100%" height="auto">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <linearGradient id="hoverGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Card 1: Web Development -->
  <g transform="translate(4, 8)">
    <rect width="226" height="74" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
    <rect x="16" y="14" width="32" height="32" rx="8" fill="#0284C7" fill-opacity="0.15" stroke="#38BDF8" stroke-width="1" />
    <text x="32" y="35" text-anchor="middle" font-size="16">💻</text>
    <text x="58" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Web Development</text>
    <text x="58" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8">Frontend &amp; Responsive UI</text>
    <path d="M 12 73 L 214 73" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
  </g>

  <!-- Card 2: Nexta Ecosystem -->
  <g transform="translate(244, 8)">
    <rect width="226" height="74" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
    <rect x="16" y="14" width="32" height="32" rx="8" fill="#4F46E5" fill-opacity="0.15" stroke="#818CF8" stroke-width="1" />
    <text x="32" y="35" text-anchor="middle" font-size="16">🚀</text>
    <text x="58" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Nexta Ecosystem</text>
    <text x="58" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8">Co-Founder &amp; Tech Lead</text>
    <path d="M 12 73 L 214 73" stroke="#818CF8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
  </g>

  <!-- Card 3: Creative Gaming -->
  <g transform="translate(484, 8)">
    <rect width="226" height="74" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
    <rect x="16" y="14" width="32" height="32" rx="8" fill="#059669" fill-opacity="0.15" stroke="#34D399" stroke-width="1" />
    <text x="32" y="35" text-anchor="middle" font-size="16">🎮</text>
    <text x="58" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Creative Gaming</text>
    <text x="58" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8">Interactive Web Games</text>
    <path d="M 12 73 L 214 73" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
  </g>

  <!-- Card 4: Continuous Growth -->
  <g transform="translate(724, 8)">
    <rect width="226" height="74" rx="12" fill="url(#cardBg)" stroke="#1E293B" stroke-width="1.2" />
    <rect x="16" y="14" width="32" height="32" rx="8" fill="#D97706" fill-opacity="0.15" stroke="#FBBF24" stroke-width="1" />
    <text x="32" y="35" text-anchor="middle" font-size="16">⚡</text>
    <text x="58" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Continuous Growth</text>
    <text x="58" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#94A3B8">Learning New Technologies</text>
    <path d="M 12 73 L 214 73" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7" />
